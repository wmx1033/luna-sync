services:
  insta360-sync:
    build: .
    image: insta360-sync:latest
    container_name: insta360-sync
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      - LUNA_CONFIG=/app/config.json
      - TZ=Asia/Shanghai
    volumes:
      - ./downloads:/downloads
      - ./state:/state
      - ./config.json:/app/config.json:ro
