name: Test

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_core.py' -v
          python -m unittest discover -s tests -p 'test_sync_store.py' -v
