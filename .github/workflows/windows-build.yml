name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - "windows-v*"
    paths:
      - "app/**"
      - "windows/**"
      - "upk/luna-sync/rootfs_common/icon.png"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r windows/requirements.txt

      - name: Prepare icon and ffmpeg
        run: python windows/prepare_assets.py

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm windows/luna_sync.spec

      - name: Write checksum
        shell: pwsh
        run: (Get-FileHash dist/Insta360Sync.exe -Algorithm SHA256).Hash + "  Insta360Sync.exe" | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Insta360Sync-Windows-x64
          path: |
            dist/Insta360Sync.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/Insta360Sync.exe dist/SHA256SUMS.txt --title "Insta360 Sync for Windows ${{ github.ref_name }}" --notes "Windows x64 executable. Double-click Insta360Sync.exe to start the local WebUI."
